name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare release files
        run: npm run release:prepare -- ${{ inputs.release_type }}

      - name: Commit and tag
        working-directory: .
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          git add app/CHANGELOG.md app/package.json app/src-tauri/tauri.conf.json \
            app/src/i18n/en.json app/src/i18n/zh.json app/src/i18n/zh-TW.json
          git commit -m "chore: bump version to ${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push --follow-tags origin HEAD:main

      # Tags pushed with GITHUB_TOKEN do not trigger the tag-push event, so
      # start the build workflow explicitly via workflow_dispatch on the tag.
      - name: Trigger Build & Release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          for attempt in 1 2 3; do
            if gh workflow run release.yml --ref "v${VERSION}"; then
              echo "Build & Release dispatched on v${VERSION}"
              exit 0
            fi
            echo "dispatch attempt ${attempt} failed, retrying..." >&2
            sleep 5
          done
          exit 1
